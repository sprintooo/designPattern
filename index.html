<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Patterns — Patidar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

<body>
  <div id="app">

    <aside id="sidebar">
      <div id="sidebar-header">
        <div class="logo-wrap">
          <span class="logo-glyph">◈</span>
          <div class="logo-text">
            <span class="logo-title">Design Patterns</span>
            <span class="logo-sub">Java · Patidar</span>
          </div>
        </div>
        <button id="sidebar-toggle" aria-label="Toggle sidebar" title="Toggle sidebar">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">

          <line x1="10.5" y1="10.5" x2="13" y2="13"/>
        </svg>
        <input id="search-input" type="text" placeholder="Filter files…" autocomplete="off" spellcheck="false">
        <button id="search-clear" aria-label="Clear search">×</button>
      </div>

      <nav id="nav-tree">
        <div class="state-msg loading-msg">
          <span class="spinner"></span>
          Loading patterns…

      </nav>
    </aside>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
