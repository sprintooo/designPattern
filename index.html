<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Patterns — Patidar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ── Sidebar ─────────────────────────────────────────── -->
  <aside id="sidebar">

    <header id="sb-head">
      <div class="sb-logo">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="2" width="7" height="7" rx="1.5" fill="#818cf8"/>
          <rect x="11" y="2" width="7" height="7" rx="1.5" fill="#a78bfa" opacity=".7"/>
          <rect x="2" y="11" width="7" height="7" rx="1.5" fill="#a78bfa" opacity=".7"/>
          <rect x="11" y="11" width="7" height="7" rx="1.5" fill="#818cf8" opacity=".5"/>
        </svg>
        <div class="sb-title-group">
          <span class="sb-title">Design Patterns</span>
          <span class="sb-subtitle">Java · Patidar</span>
        </div>
      </div>
      <button id="sb-toggle" aria-label="Toggle sidebar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M1 3.5A.5.5 0 0 1 1.5 3h13a.5.5 0 0 1 0 1h-13A.5.5 0 0 1 1 3.5zm0 4A.5.5 0 0 1 1.5 7h13a.5.5 0 0 1 0 1h-13A.5.5 0 0 1 1 7.5zm0 4A.5.5 0 0 1 1.5 11h13a.5.5 0 0 1 0 1h-13a.5.5 0 0 1-.5-.5z"/>

        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
      </svg>
      <input id="search-input" type="search" placeholder="Filter files…" autocomplete="off" spellcheck="false">
    </div>

    <nav id="nav-tree">
      <p class="state-line"><span class="spinner"></span> Loading…</p>
    </nav>

  </aside>

  <!-- ── Viewer ──────────────────────────────────────────── -->
  <main id="viewer">

    <div id="viewer-bar">
      <div id="breadcrumb"></div>
      <a id="gh-btn" href="https://github.com/sprintooo/designPattern" target="_blank" rel="noopener">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>

    <div id="code-wrap">

        <svg class="welcome-icon" width="48" height="48" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="2" width="7" height="7" rx="1.5" fill="#818cf8" opacity=".4"/>
          <rect x="11" y="2" width="7" height="7" rx="1.5" fill="#a78bfa" opacity=".3"/>
          <rect x="2" y="11" width="7" height="7" rx="1.5" fill="#a78bfa" opacity=".3"/>
          <rect x="11" y="11" width="7" height="7" rx="1.5" fill="#818cf8" opacity=".2"/>
        </svg>
        <h2>Design Patterns Explorer</h2>
        <p>Select a file from the sidebar to view source code.</p>
      </div>
    </div>

  </main>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>

</html>
