<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Design Patterns</title>
  <meta name="description" content="Track your progress across all 21 design patterns.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="nav-placeholder"></div>

<div class="container">
  <div class="dashboard-grid">

    <!-- Progress sidebar -->
    <aside>
      <div class="card progress-card" style="margin-bottom:20px;">
        <h2>Your Progress</h2>
        <div class="progress-fraction">
          <span id="done-count">0</span><span> / 21</span>
        </div>
        <p class="progress-label">patterns completed</p>
        <div class="progress-bar-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="21" id="progress-bar-wrap">
          <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
        </div>
        <div class="continue-btn-wrap">
          <a href="#" id="continue-btn" class="btn btn-primary" style="width:100%;justify-content:center;">
            Continue Learning
          </a>
        </div>
      </div>

      <div class="card progress-card">
        <h2 style="font-size:15px;margin-bottom:16px;">By Category</h2>
        <div class="category-progress" id="cat-progress"></div>
      </div>
    </aside>

    <!-- Pattern lists -->
    <div>
      <div class="dashboard-section">
        <h2 class="patterns-section" style="font-size:20px;font-weight:700;margin-bottom:20px;">
          Creational Patterns
        </h2>
        <div class="pattern-grid" id="grid-creational"></div>
      </div>

      <div class="dashboard-section">
        <h2 style="font-size:20px;font-weight:700;margin-bottom:20px;">
          Structural Patterns
        </h2>
        <div class="pattern-grid" id="grid-structural"></div>
      </div>

      <div class="dashboard-section">
        <h2 style="font-size:20px;font-weight:700;margin-bottom:20px;">
          Behavioral Patterns
        </h2>
        <div class="pattern-grid" id="grid-behavioral"></div>
      </div>
    </div>

  </div>
</div>

<div id="footer-placeholder"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/nav.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
