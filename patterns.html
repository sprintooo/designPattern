<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pattern Library — Design Patterns</title>
  <meta name="description" content="Browse all 21 software design patterns. Filter by category, difficulty, or search by name.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="nav-placeholder"></div>

<div class="page-header" style="background:var(--surface);">
  <div class="container">
    <h1>Pattern Library</h1>
    <p>21 patterns across 3 categories. Search, filter, and track your progress.</p>
  </div>
</div>

<div class="container" style="padding-top:32px;padding-bottom:80px;">

  <!-- Search + Filters -->
  <div class="search-row">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/>
      </svg>
      <input type="search" id="search" placeholder="Search patterns…" aria-label="Search patterns">
    </div>

    <div class="filter-tabs" role="group" aria-label="Filter by category">
      <button class="filter-tab active" data-filter="cat" data-value="all">All</button>
      <button class="filter-tab" data-filter="cat" data-value="creational">Creational</button>
      <button class="filter-tab" data-filter="cat" data-value="structural">Structural</button>
      <button class="filter-tab" data-filter="cat" data-value="behavioral">Behavioral</button>
    </div>

    <div class="filter-tabs" role="group" aria-label="Filter by difficulty">
      <button class="filter-tab active" data-filter="diff" data-value="all">All Levels</button>
      <button class="filter-tab" data-filter="diff" data-value="beginner">Beginner</button>
      <button class="filter-tab" data-filter="diff" data-value="intermediate">Intermediate</button>
      <button class="filter-tab" data-filter="diff" data-value="advanced">Advanced</button>
    </div>
  </div>

  <!-- Count row -->
  <p id="count-row" style="font-size:13px;color:var(--text-muted);margin-bottom:20px;" aria-live="polite"></p>

  <!-- Grid -->
  <div class="pattern-grid" id="pattern-grid"></div>

  <div id="empty-state" class="empty-state" hidden>
    <h3>No patterns match your filters</h3>
    <p>Try clearing your search or changing the category filter.</p>
    <button class="btn btn-secondary mt-16" id="clear-btn">Clear filters</button>
  </div>

</div>

<div id="footer-placeholder"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/nav.js"></script>
<script>
  injectNav('patterns');
  injectFooter();

  // read URL params for initial filter
  const urlParams = new URLSearchParams(window.location.search);
  let catFilter  = urlParams.get('cat')  || 'all';
  let diffFilter = 'all';
  let searchQuery = '';

  const grid       = document.getElementById('pattern-grid');
  const emptyState = document.getElementById('empty-state');
  const countRow   = document.getElementById('count-row');
  const searchEl   = document.getElementById('search');

  function buildCard(p) {
    const done = Progress.isDone(p.id);
    const c = CATEGORIES[p.category];
    const d = DIFFICULTIES[p.difficulty];
    return `
      <a href="pattern.html?id=${p.id}" class="card card-hover pattern-card" aria-label="${p.name}${done ? ' (Completed)' : ''}">
        <div class="pattern-card-top">
          <span class="badge badge-cat" style="--cat-color:${c.color}">${c.label}</span>
          ${done ? '<span class="done-check" aria-label="Completed">✓ Done</span>' : ''}
        </div>
        <h3>${p.name}</h3>
        <p>${p.summary}</p>
        <div class="pattern-card-meta">
          <span class="badge badge-diff" style="--diff-color:${d.color}">${d.label}</span>
          <span style="font-size:12px;color:var(--text-dim);">${p.readingTime} min read</span>
          ${p.hasRepoCode ? '<span style="font-size:12px;color:var(--accent);font-weight:500;">Code in repo</span>' : ''}
        </div>
      </a>`;
  }

  function render() {
    const q = searchQuery.toLowerCase().trim();
    const filtered = PATTERN_ORDER.map(id => PATTERNS[id]).filter(p => {
      if (catFilter  !== 'all' && p.category   !== catFilter)  return false;
      if (diffFilter !== 'all' && p.difficulty !== diffFilter) return false;
      if (q) {
        const haystack = (p.name + ' ' + p.summary + ' ' + p.category).toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    });

    grid.innerHTML = filtered.map(buildCard).join('');
    const shown = filtered.length;
    const total = PATTERN_ORDER.length;
    countRow.textContent = shown === total
      ? `Showing all ${total} patterns`
      : `Showing ${shown} of ${total} patterns`;
    emptyState.hidden = shown > 0;
    grid.hidden = shown === 0;
  }

  // set active tab helper
  function setActive(group, value) {
    document.querySelectorAll(`[data-filter="${group}"]`).forEach(btn => {
      btn.classList.toggle('active', btn.dataset.value === value);
    });
  }

  // restore cat param
  if (catFilter !== 'all') setActive('cat', catFilter);

  document.querySelectorAll('.filter-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const { filter, value } = btn.dataset;
      if (filter === 'cat')  catFilter  = value;
      if (filter === 'diff') diffFilter = value;
      setActive(filter, value);
      render();
    });
  });

  searchEl.addEventListener('input', e => {
    searchQuery = e.target.value;
    render();
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    catFilter = diffFilter = 'all';
    searchQuery = '';
    searchEl.value = '';
    setActive('cat',  'all');
    setActive('diff', 'all');
    render();
  });

  document.addEventListener('progress-changed', render);

  render();
</script>
</body>
</html>
